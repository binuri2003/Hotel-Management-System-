<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Grand Hotel</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Lato:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="auth-container">
        <div class="auth-card card-register">
            <h2 class="hotel-title">New Guest Registration</h2>
            <p class="tagline">Join us for an unforgettable stay</p>

            <form action="#"> <div style="display: flex; gap: 15px;">
                    <div style="flex: 1;">
                        <label class="form-label">First Name</label>
                        <input type="text" name="fname" class="form-control" required>
                    </div>
                    <div style="flex: 1;">
                        <label class="form-label">Last Name</label>
                        <input type="text" name="lname" class="form-control" required>
                    </div>
                </div>

                <label class="form-label">Email Address</label>
                <input type="email" name="email" class="form-control" required>

                <label class="form-label">Phone Number</label>
                <input type="text" name="phone" class="form-control" required>
                
                <label class="form-label">Address</label>
                <input type="text" name="address" class="form-control" required>

                <hr style="border: 0; border-top: 1px solid #eee; margin: 20px 0;">

                <div style="display: flex; gap: 15px;">
                    <div style="flex: 1;">
                        <label class="form-label">Create Username</label>
                        <input type="text" name="username" class="form-control" required>
                    </div>
                    <div style="flex: 1;">
                        <label class="form-label">Create Password</label>
                        <input type="password" name="password" class="form-control" required>
                    </div>
                </div>

                <button type="submit" class="btn-gold" style="margin-top: 20px;">CREATE ACCOUNT</button>
            </form>

            <div style="text-align: center; margin-top: 20px;">
                <a href="index.html" style="text-decoration: none; color: #666;">
                    Already have an account? <strong>Sign In</strong>
                </a>
            </div>
        </div>
    </div>

</body>
</html>
