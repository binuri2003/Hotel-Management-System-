<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reserve Room - Grand Hotel</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="Hotel management system.css">
</head>
<body>

<nav class="navbar navbar-expand-lg" style="background-color:#155724;">
  <div class="container">
    <a class="navbar-brand text-gold" href="index.html">Grand Hotel</a>
    <ul class="navbar-nav ms-auto">
      <li class="nav-item"><a class="nav-link text-gold" href="rooms.html">View Rooms</a></li>
      <li class="nav-item"><a class="nav-link text-gold" href="history.html">Reservation History</a></li>
    </ul>
  </div>
</nav>

<div class="container my-5">
    <h2 class="text-center text-gold mb-4">Reserve Your Room</h2>

    <form class="reservation-form" onsubmit="return validateReservationForm();">
        <label for="customerID">Customer ID</label>
        <input type="text" id="customerID" placeholder="Enter your Customer ID">

        <label for="roomID">Room Type</label>
        <select id="roomID">
            <option value="AC">AC Room</option>
            <option value="NonAC">Non-AC Room</option>
            <option value="SeaView">Sea View Room</option>
        </select>
        <label for="roomID">room ID</label>
        <input type="text" id="roomID" placeholder="Enter room ID">

        <label for="checkIn">Check-in Date</label>
        <input type="date" id="checkIn">

        <label for="checkOut">Check-out Date</label>
        <input type="date" id="checkOut">

        <label for="specialReq">Special Requests</label>
        <textarea id="specialReq" placeholder="Any special requests..."></textarea>

        <button type="submit" class="btn btn-gold-solid">Reserve Room</button>
    </form>
</div>

<script src="Hotel management system.js"></script>
</body>
</html>
