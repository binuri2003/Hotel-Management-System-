<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reserve Room - Grand Hotel</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        :root {
            --teal-dark: #155724;
            --gold: #FFD700;
        }

        body {
            font-family: 'Lato', sans-serif;
            background-color: #f5f5f5;
        }

        .navbar {
            background-color: var(--teal-dark);
        }

        .nav-link {
            color: var(--gold) !important;
        }

        .nav-link:hover {
            color: white !important;
        }

        .btn-gold-solid {
            background-color: var(--gold);
            color: var(--teal-dark);
            border: none;
            padding: 10px 20px;
            border-radius: 3px;
            font-weight: 600;
        }

        .btn-gold-solid:hover {
            background-color: white;
            color: var(--gold);
        }

        .reservation-form label {
            font-weight: 500;
            color: var(--teal-dark);
        }

        .reservation-form input, 
        .reservation-form select, 
        .reservation-form textarea {
            border: 1px solid #ccc;
            border-radius: 3px;
            padding: 8px;
            width: 100%;
            margin-bottom: 10px;
        }

        .reservation-form textarea {
            resize: vertical;
        }

        .container {
            max-width: 600px;
        }
    </style>
</head>
<body>

<!-- Navbar -->
<nav class="navbar navbar-expand-lg">
    <div class="container">
        <a class="navbar-brand text-gold" href="index.html">Grand Hotel</a>
        <ul class="navbar-nav ms-auto">
            <li class="nav-item"><a class="nav-link" href="rooms.html">View Rooms</a></li>
            <li class="nav-item"><a class="nav-link" href="history.html">Reservation History</a></li>
        </ul>
    </div>
</nav>

<!-- Reservation Form -->
<div class="container my-5">
    <h2 class="text-center mb-4" style="color: var(--gold);">Reserve Your Room</h2>

    <form class="reservation-form" method="POST" action="reserveRoom.php">
        <label for="customerID">Customer ID</label>
        <input type="text" id="customerID" name="customerID" placeholder="Enter your Customer ID" required>

        <label for="roomType">Room Type</label>
        <select id="roomType" name="roomType" required>
            <option value="AC">AC Room</option>
            <option value="NonAC">Non-AC Room</option>
            <option value="SeaView">Sea View Room</option>
        </select>

        <label for="roomID">Room ID</label>
        <input type="text" id="roomID" name="roomID" placeholder="Enter Room ID" required>

        <label for="checkIn">Check-in Date</label>
        <input type="date" id="checkIn" name="checkIn" required>

        <label for="checkOut">Check-out Date</label>
        <input type="date" id="checkOut" name="checkOut" required>

        <label for="specialReq">Special Requests</label>
        <textarea id="specialReq" name="specialReq" placeholder="Any special requests..."></textarea>

        <button type="submit" class="btn btn-gold-solid">Reserve Room</button>
    </form>
</div>

</body>
</html>
