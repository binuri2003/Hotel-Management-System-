<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In - Grand Hotel</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Lato:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="auth-container">
        <div class="auth-card card-login">
            <img src="logo.jpg" alt="Grand Hotel Logo" class="logo">
            <h1 class="hotel-title">GRAND HOTEL</h1>
            <p class="tagline">Luxury & Comfort Awaits</p>

            <form action="#"> <div style="text-align: left;">
                    <label class="form-label">Username</label>
                    <input type="text" name="username" class="form-control" placeholder="Enter username" required>
                    
                    <label class="form-label">Password</label>
                    <input type="password" name="password" class="form-control" placeholder="Enter password" required>
                </div>

                <button type="submit" class="btn-gold">SIGN IN</button>
            </form>

            <div style="margin-top: 30px; border-top: 1px solid #eee; padding-top: 20px;">
                <p style="font-size: 0.9rem; color: #666;">Don't have an account?</p>
                <a href="register.html" class="btn-outline">SIGN UP (Create Account)</a>
            </div>
        </div>
    </div>

</body>
</html>
