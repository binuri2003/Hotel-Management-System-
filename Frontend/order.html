<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Order Food</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="hotel.css">
</head>
<body>

<nav class="navbar navbar-expand-lg" style="background-color:#75eb91;">
    <div class="container">
        <a class="navbar-brand text-white" href="index.html">Grand Hotel</a>
    </div>
</nav>

<div class="container mt-5">
    <h2>Order Food</h2>

    <!-- FORM -->
    <form action="order.php" method="POST" onsubmit="return generateBill()">

        <input type="text" id="roomID" name="room_id"
               class="form-control mb-2" placeholder="Room ID" required>

        <input type="text" id="foodID" name="food_id"
               class="form-control mb-2" placeholder="Food ID (e.g. 001)" required>

        <input type="number" id="qty" name="quantity"
               class="form-control mb-2" min="1" value="1" required>

        <!-- HIDDEN TOTAL -->
        <input type="hidden" id="total_price" name="total_price">

        <button type="submit" class="btn btn-success">
            Generate Bill & Save
        </button>
    </form>

    <hr>

    <!-- BILL -->
    <h3>Bill</h3>
    <table class="table table-bordered">
        <thead class="table-success">
            <tr>
                <th>Room</th>
                <th>Food</th>
                <th>Qty</th>
                <th>Price (Rs.)</th>
            </tr>
        </thead>
        <tbody id="billBody"></tbody>
        <tfoot>
            <tr>
                <th colspan="3">Total</th>
                <th id="total">Rs. 0</th>
            </tr>
        </tfoot>
    </table>
</div>

<!-- CONNECT JS -->
<script src="Hotel management system.js"></script>
</body>
</html>
